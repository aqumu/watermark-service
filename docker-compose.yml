services:
  watermark-service:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    environment:
      - WM_CONFIG_PATH=/app/config/default.yaml
